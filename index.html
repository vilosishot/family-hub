<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Family Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f9e95">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f3;--card:#fff;--ink:#2a2622;--muted:#8a827a;--line:#ece6de;--chip:#f3eee8;--accent:#c8664c;--good:#2f8f5b;--bad:#c2493d;--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(60,40,20,.06);--serif:'Fraunces',Georgia,serif;--sans:'Nunito',system-ui,sans-serif}
[data-theme=dark]{--bg:#15171b;--card:#20242a;--ink:#eef0f3;--muted:#98a1ab;--line:#2e343c;--chip:#2a2f37;--accent:#e58a6f;--good:#4cb67c;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);transition:background .25s,color .25s}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;height:42px;padding:0 12px;font-weight:700;width:100%}
textarea{height:70px;padding:10px 12px}
.p{--soft:color-mix(in srgb,var(--c) 24%,var(--card));--tint:color-mix(in srgb,var(--c) 9%,var(--bg))}
.app{display:grid;grid-template-columns:78px 1fr;height:100vh;height:100dvh}
.side{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px;overflow:auto}
.side .logo{font-family:var(--serif);font-size:22px;margin-bottom:12px;color:var(--accent)}
.side button{width:64px;padding:8px 0;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted);position:relative}
.side button .i{font-size:22px;filter:grayscale(1);opacity:.6}
.side button.on{background:var(--chip);color:var(--ink)} .side button.on .i{filter:none;opacity:1}
.side .sp{flex:1}
.side .badge{position:absolute;top:4px;right:8px;background:var(--accent);color:#fff;border-radius:9px;font-size:10px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.head{display:flex;align-items:center;gap:12px;padding:14px 22px 10px;flex-wrap:wrap}
.head h1{font-family:var(--serif);font-weight:600;font-size:26px;margin:0}
.head .time{font-weight:800;color:var(--muted);font-size:17px}
.head .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sync{width:10px;height:10px;border-radius:50%;background:var(--muted)} .sync.ok{background:var(--good)} .sync.busy{background:#d9a432} .sync.err{background:var(--bad)}
.pill{height:38px;padding:0 14px;border-radius:19px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.p.on{background:var(--c);border-color:var(--c);color:#fff}
.btn{height:42px;padding:0 18px;border-radius:21px;background:var(--ink);color:var(--bg);font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.light{background:var(--chip);color:var(--ink)} .btn.bad{background:var(--bad);color:#fff} .btn.good{background:var(--good);color:#fff} .btn.sm{height:34px;padding:0 12px;font-size:13px}
.body{flex:1;overflow:auto;padding:4px 22px 60px}
.hint{color:var(--muted);font-weight:700;font-size:14px}
.banner{background:color-mix(in srgb,#f3c34a 20%,var(--card));border-radius:14px;padding:10px 14px;font-weight:700;font-size:14px;margin-bottom:14px}
.av{width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;flex:none}
.av.s{width:26px;height:26px;font-size:12px}
.title{font-family:var(--serif);font-weight:600;margin:0;font-size:26px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
/* today */
.cols{display:grid;gap:14px;grid-template-columns:repeat(var(--n),minmax(240px,1fr));align-items:start}
.col{border-radius:22px;background:var(--tint);padding:14px 12px 16px;min-width:0}
.ph{display:flex;align-items:center;gap:10px;padding:0 4px}
.ph .nm{font-family:var(--serif);font-size:24px;font-weight:500;line-height:1}
.ph .row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.ph .av{position:relative}
.ph .av .pal{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:var(--card);font-size:11px;display:grid;place-items:center;box-shadow:var(--shadow)}
.prog{height:24px;min-width:70px;border-radius:12px;background:var(--card);position:relative;overflow:hidden;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 10px}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--soft)} .prog span{position:relative}
.stars{height:24px;border-radius:12px;background:var(--card);font-size:12px;font-weight:800;display:flex;align-items:center;gap:4px;padding:0 9px}
.rings{display:flex;justify-content:space-between;margin:14px 2px 6px}
.ring{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--muted);width:25%}
.ring .c{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:conic-gradient(var(--c) calc(var(--pc)*1%), var(--card) 0);position:relative}
.ring .c:after{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--tint)}
.ring .c span{position:relative;z-index:1}
.ring.on{color:var(--ink)} .ring.on .c{box-shadow:0 0 0 2px var(--c)}
.days{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.days .pill{height:44px;flex-direction:column;gap:0;line-height:1.05;padding:0 12px;font-size:12px}
.days .pill b{font-size:16px}
.plan{margin:10px 2px 4px;border-radius:16px;background:var(--card);padding:8px 12px}
.plan .r{display:flex;gap:8px;font-size:13px;font-weight:800;padding:4px 0;border-top:1px solid var(--line)} .plan .r:first-child{border-top:0}
.plan .r .tm{width:66px;flex:none;color:var(--muted)} .plan .r.now{color:var(--c)} .plan .r.gc{color:var(--muted)}
.ck[disabled]{opacity:.35}
.play{margin:10px 2px 6px;border-radius:18px;background:var(--card);padding:12px 14px;box-shadow:var(--shadow)}
.play .pt{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:22px}
.play .pt .em{font-size:28px} .play .pt small{margin-left:auto;font-family:var(--sans);font-size:14px;font-weight:800;color:var(--muted)}
.play .pbar{height:26px;border-radius:13px;background:var(--chip);overflow:hidden;margin:10px 0 8px;position:relative}
.play .pbar i{display:block;height:100%;background:var(--c);border-radius:13px;transition:width .5s}
.play .pbar span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:13px}
.play.open{background:color-mix(in srgb,var(--good) 14%,var(--card))} .play.open .pbar i{background:var(--good)}
.privs{display:flex;gap:6px;flex-wrap:wrap}
.priv{font-size:12.5px;font-weight:800;border-radius:12px;padding:5px 9px;background:var(--chip);color:var(--muted)}
.priv.on{background:color-mix(in srgb,var(--good) 20%,var(--card));color:var(--good)} .priv.no{background:color-mix(in srgb,var(--bad) 16%,var(--card));color:var(--bad)}
.gate{margin:8px 2px 4px;border-radius:14px;background:var(--card);padding:9px 12px;font-weight:800;font-size:14px;color:var(--muted)}
.gate.open{color:var(--good);background:color-mix(in srgb,var(--good) 15%,var(--card))}
.wkbar{margin:8px 4px 0;font-size:12px;font-weight:800;color:var(--muted)}
.wkbar .b{height:8px;border-radius:4px;background:var(--card);overflow:hidden;margin-top:4px}
.wkbar .b i{display:block;height:100%;background:var(--c)}
.sec{font-family:var(--serif);font-size:18px;margin:14px 4px 8px;display:flex;align-items:center}
.sec small{margin-left:auto;font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:800}
.card{width:100%;border-radius:18px;background:var(--card);margin-bottom:8px;overflow:hidden;display:block}
.card .pic{height:70px;display:grid;place-items:center;font-size:40px;background:var(--soft);width:100%}
.card .bot{display:flex;align-items:center;gap:8px;padding:9px 12px}
.card .t{flex:1;font-weight:800;font-size:15px;line-height:1.2;text-align:left}
.card.done{opacity:.6} .card.done .pic{background:var(--c)}
.rowt{width:100%;display:flex;align-items:center;gap:10px;border-radius:16px;background:var(--card);padding:8px 10px 8px 12px;margin-bottom:7px}
.rowt .e{font-size:22px;width:28px;text-align:center}
.rowt .t{flex:1;font-weight:800;font-size:15px;line-height:1.2;text-align:left;min-height:34px;display:flex;flex-direction:column;justify-content:center}
.rowt .t small{display:block;color:var(--muted);font-size:12px}
.rowt.done .t{color:var(--muted);text-decoration:line-through}
.st{display:inline-flex;align-items:center;gap:3px;background:var(--chip);border-radius:10px;padding:2px 7px;font-size:12px;font-weight:800}
.ck{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--card);flex:none;display:grid;place-items:center;color:transparent;font-size:18px;font-weight:900}
.done .ck{background:var(--c);border-color:var(--c);color:#fff}
.empty{border:2px dashed color-mix(in srgb,var(--c) 35%,var(--line));border-radius:16px;padding:16px;text-align:center;color:var(--muted);font-weight:700;font-size:14px;margin-top:12px}
.empty button{color:var(--ink);text-decoration:underline;font-weight:800}
.box{margin-top:20px;background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow)}
.box h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:0}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.pc{border-radius:16px;background:var(--bg);padding:12px;display:flex;flex-direction:column;gap:8px;border:2px solid transparent;text-align:left}
.pc .top{display:flex;gap:10px;align-items:center}
.pc .e{font-size:28px} .pc .t{font-weight:800;font-size:15px;line-height:1.2} .pc .t small{display:block;color:var(--muted);font-size:12px}
.pc .acts{display:flex;gap:6px;flex-wrap:wrap}
.pc.taken{border-color:var(--c);background:var(--tint)} .pc.fin{opacity:.6} .pc.dim{opacity:.45}
.who{font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
/* library */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.lib{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.li .e{font-size:26px;width:34px;text-align:center}
.li .t{flex:1;min-width:0;font-weight:800;font-size:15px;text-align:left}
.li .t small{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-top:2px}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:8px;padding:1px 7px;margin-right:4px;background:var(--chip);color:var(--muted)}
.tag.tr{background:color-mix(in srgb,#2f9e95 18%,var(--card));color:#2a8a82}
.tag.te{background:color-mix(in srgb,#e0735a 18%,var(--card));color:#c45b43}
.tag.ta{background:color-mix(in srgb,#5b84c4 18%,var(--card));color:#4f74b0}
.as{display:flex;gap:5px;flex-wrap:nowrap;justify-content:flex-end}
.ab{height:32px;padding:0 10px;border-radius:16px;font-size:12px;font-weight:800;border:1.5px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.ab.on{background:var(--c);border-color:var(--c);color:#fff}
.ab.abpool.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.grp{font-family:var(--serif);font-size:19px;padding:14px 14px 6px;background:var(--bg)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.5);display:grid;place-items:center;z-index:50;padding:18px}
.modal{background:var(--card);border-radius:24px;padding:22px;width:100%;max-width:580px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{font-family:var(--serif);font-weight:500;margin:0 0 14px;font-size:24px}
.modal .big{font-size:64px;text-align:center;line-height:1.1}
.fl{display:flex;flex-direction:column;gap:5px;font-weight:800;font-size:13px;margin-bottom:12px;color:var(--muted)}
.inl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:800;color:var(--ink);font-size:14px}
.inl input,.inl select{width:auto;min-width:70px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:90px 1fr;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipb{height:36px;min-width:36px;padding:0 12px;border-radius:18px;border:1.5px solid var(--line);font-weight:800;font-size:13px;color:var(--muted)}
.chipb.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chipb.p.on{background:var(--c);border-color:var(--c);color:#fff}
.mact{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.mact .sp{flex:1}
.part{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:10px}
.swb{aspect-ratio:1;border-radius:50%;background:var(--c);position:relative;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;border:3px solid transparent}
.swb.mine{border-color:var(--ink);box-shadow:0 0 0 3px var(--card) inset}
.swb.taken{opacity:.28;cursor:not-allowed}
.swb.taken:after{content:'';position:absolute;left:12%;right:12%;top:50%;height:3px;background:#fff;transform:rotate(-45deg);border-radius:2px}
.pin{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center;margin-top:14px}
.pin button{height:72px;border-radius:50%;background:var(--chip);font-family:var(--serif);font-size:28px}
.dots{display:flex;gap:12px;justify-content:center} .dots i{width:14px;height:14px;border-radius:50%;background:var(--line)} .dots i.f{background:var(--ink)}
/* family */
.fam{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.fc{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);border-top:8px solid var(--c)}
.fc .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.fc .top .nm{font-family:var(--serif);font-size:22px;flex:1}
.arr{width:36px;height:36px;border-radius:50%;background:var(--chip);font-weight:900}
.arr:disabled{opacity:.3}
/* schedule */
.tl{display:grid;grid-template-columns:44px repeat(var(--n),minmax(0,1fr));gap:10px}
.tcol{position:relative;background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
.tcol .hh{height:48px;display:flex;align-items:center;gap:8px;padding:0 10px;font-family:var(--serif);font-size:18px}
.tcol .hh button{margin-left:auto;font-family:var(--sans)}
.blk{position:absolute;left:6px;right:6px;border-radius:10px;padding:4px 8px;background:color-mix(in srgb,var(--bc) 22%,var(--card));border-left:4px solid var(--bc);font-size:12px;font-weight:800;overflow:hidden;line-height:1.2;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start}
.blk small{color:var(--muted);font-weight:700;display:block}
.blk.gc{border-left-style:dashed}
.hr{position:absolute;left:0;right:0;border-top:1px dashed var(--line);font-size:11px;font-weight:800;color:var(--muted)}
.now{position:absolute;left:0;right:0;height:2px;background:var(--accent);z-index:2}
/* calendar + rewards */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{background:var(--card);border-radius:18px;padding:10px;min-height:380px;box-shadow:var(--shadow)}
.day h3{font-family:var(--serif);font-weight:500;font-size:18px;margin:0 0 8px;display:flex;align-items:baseline;gap:6px}
.day h3 b{font-family:var(--sans);font-size:12px;color:var(--muted)}
.day.today h3 b{background:var(--accent);color:#fff;border-radius:10px;padding:1px 7px}
.ev{border-radius:12px;padding:7px 9px;margin-bottom:6px;background:color-mix(in srgb,var(--c) 20%,var(--card));font-weight:800;font-size:12.5px;line-height:1.2;display:block;width:100%;text-align:left}
.ev small{display:block;color:var(--muted);font-weight:700;font-size:11px}
.ev.chore{background:var(--card);border:1.5px dashed var(--c)} .ev.chore.dn{opacity:.5;text-decoration:line-through}
.rw{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.rc{background:var(--card);border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.rc .e{font-size:42px;text-align:center} .rc .t{font-family:var(--serif);font-size:19px;line-height:1.15;flex:1}
.rbar{height:32px;border-radius:16px;background:var(--chip);position:relative;overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:13px}
.rbar i{position:absolute;inset:0 auto 0 0;background:var(--soft)} .rbar span{position:relative}
.rbar.go{background:var(--c);color:#fff} .rbar.go i{display:none}
.jars{display:flex;gap:10px;margin:8px 0 16px;flex-wrap:wrap}
.jar{background:var(--card);border-radius:18px;padding:10px 16px;min-width:110px;box-shadow:var(--shadow)}
.jar b{font-family:var(--serif);font-size:22px;font-weight:500;display:block}
.jar span{font-size:12px;font-weight:800;color:var(--muted)}
.list .it{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)} .list .it:first-child{border-top:0}
.list .it .t{flex:1;font-weight:800} .list .it .t small{display:block;color:var(--muted);font-weight:700}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:24px;padding:12px 20px;font-weight:800;z-index:60;max-width:90vw;text-align:center}
#cf{position:fixed;inset:0;pointer-events:none;z-index:70}
/* ---------- phone ---------- */
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .side{order:2;flex-direction:row;justify-content:space-around;padding:4px 2px calc(4px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);overflow:visible}
  .side .logo,.side .sp,.side [data-a=theme]{display:none}
  .side button{width:auto;flex:1;padding:6px 0;font-size:10px}
  .main{order:1}
  .head{padding:10px 14px 6px;gap:8px} .head h1{font-size:20px} .head .time{font-size:14px}
  .head .r{margin-left:0;width:100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  .body{padding:4px 12px 40px}
  .cols{grid-template-columns:1fr} .pg{grid-template-columns:1fr}
  .wk{grid-template-columns:1fr} .day{min-height:0}
  .twocol,.g2{grid-template-columns:1fr}
  .li{flex-wrap:wrap} .li .as{width:100%;justify-content:flex-start;overflow-x:auto;order:3}
  .modal{padding:18px;border-radius:20px} .scrim{padding:8px;align-items:end}
  .tl{grid-template-columns:36px 1fr}
}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side"></nav>
  <div class="main">
    <div class="head"><h1 id="hd"></h1><span class="time" id="tm"></span><span class="sync" id="sync"></span><div class="r" id="hr"></div></div>
    <div class="body" id="view"></div>
  </div>
</div>
<div id="modal"></div><div id="toast"></div><canvas id="cf"></canvas>

function derive(){

  cfg().people.forEach(p => ensure(p.id));

function nameIssues(title, room, id){
  const t = title.trim(), out = [], w = t.split(/\s+/).filter(Boolean);
  if (!t) return out;
  if (room && t.toLowerCase().includes(room.toLowerCase().replace(/'s?$/,''))) out.push(`Leave "${room}" out; the 📍 room tag shows it`);
  if (w.length > 6) out.push('Try 2–5 words; put details in the description');
  if (/^\d|minute/i.test(t)) out.push('Put times at the end, like "Tidy up (10 min)"');
  if (/^(the|a|my)\b/i.test(t)) out.push('Start with the action, like "Wipe…" or "Feed…"');
  if (cfg().chores.some(c => c.id!==id && c.title.toLowerCase()===t.toLowerCase() && (c.room||'')===room)) out.push('Another chore already has this name in this room');
  if (t[0] !== t[0].toUpperCase()) out.push('Start with a capital letter');
  return out;
}

function pGuide(){

    <p><b>💛 Taking care of me = no pay.</b> Getting dressed, bed, teeth, hamper, reading and similar jobs are just what we do. They earn nothing, but they still have to be done before friends and games (the 🔒) and for the finish-the-day bonus.</p><p><b>💰 Helping the family = chore points → allowance.</b> Jobs that help the whole house have points by how hard they are: Easy 1 · Medium 2 · Hard 3 · Big job 5. The week's allowance is paid by the share of points earned (${[...s.tiers].sort((a,b)=>b.min-a.min).map(t=>`${t.min}%+ → ${t.pay}%`).join(', ')}). Skipping a hard chore costs more than skipping an easy one.</p>

    <p><b>Demerits take stars</b>: small stuff 1–2, not OK 3–5, serious 8–10. Max ${s.demeritCap} ⭐ a day, never below zero. A serious demerit costs about a dollar, or most of a movie pick.</p></div>
    <div class="box" style="margin-top:0"><h2>Why it's set up this way</h2>

    const copies = chipVals('copyrooms').filter(r => r !== v.room), base = d.c==='new' ? cfg().chores[0] : cfg().chores.find(x=>x.id===d.c);
    const plain = v.room ? title.replace(new RegExp('\\s*[-–·]?\\s*'+v.room.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*$','i'),'').trim() : title;
    copies.forEach(r => cfg().chores.unshift(Object.assign(JSON.parse(JSON.stringify(base)), {id:'c'+uid(), room:r, title:plain, assign:[], pool:false, rotate:''})));
    modal(''); saveConfig(copies.length ? `Saved + ${copies.length} room cop${copies.length===1?'y':'ies'} (not assigned yet)` : d.c==='new'?'Chore added':'Chore saved'); },
  morerooms: () => { const el = $('#roomcopy'); el.style.display = el.style.display==='none' ? '' : 'none'; return 'skip'; },
  delchore: d => needParent(() => { if (!confirm('Delete this chore?')) return; S.config.chores = cfg().chores.filter(x=>x.id!==d.c); modal(''); saveConfig('Chore deleted'); render(); }),
  block: d => needParent(() => editBlock(d.id, d.p)),
  saveblock: d => { const title = $('#b_title').value.trim(); if (!title){ toast('Give it a name'); return 'skip'; }
    const v = {title, emoji:$('#b_emoji').value||'⭐', start:$('#b_start').value, end:$('#b_end').value, days:chipVals('bdays').map(Number), who:chipVals('bwho'), color:chipVals('bcolor')[0]||'', kind:chipVals('bkind')[0]||''};
    if (!v.who.length){ toast("Pick who it's for"); return 'skip'; } if (!v.days.length){ toast('Pick at least one day'); return 'skip'; } if (v.end<=v.start){ toast('End time must be after the start'); return 'skip'; }
    if (d.id==='new') cfg().sched.push(Object.assign({id:'s'+uid()}, v)); else Object.assign(cfg().sched.find(x=>x.id===d.id), v);
    modal(''); saveConfig('Saved. Updating Google Calendar…'); },
  delblock: d => { if (!confirm('Delete this from the schedule?')) return 'skip'; S.config.sched = cfg().sched.filter(x=>x.id!==d.id); modal(''); saveConfig('Deleted'); },
  move: d => needParent(() => { const i = Number(d.i), j = i+Number(d.d), L = cfg().people; [L[i], L[j]] = [L[j], L[i]]; saveConfig('Order saved'); render(); }),
  kid: d => needParent(() => { P(d.p).kid = d.k==='1'; saveConfig(); render(); }),
  addperson: () => needParent(() => { const free = Object.keys(PALETTE).find(k=>!cfg().people.some(p=>p.color===k)); cfg().people.push({id:'p'+uid(), name:'New person', full:'', kid:false, color:free, bday:'', allowance:'', goal:'', goalCost:''}); saveConfig(); render(); }),
  delperson: d => needParent(() => { if (!confirm(`Remove ${P(d.p).name}? Their chores go back to "not used".`)) return; S.config.people = cfg().people.filter(p=>p.id!==d.p); cfg().chores.forEach(c=>c.assign=arr(c.assign).filter(x=>x!==d.p)); cfg().sched.forEach(b=>b.who=b.who.filter(x=>x!==d.p)); saveConfig(); render(); }),
  editreward: d => { const r = d.r==='new' ? {id:'new', emoji:'🎁', title:'', cost:20, cash:'', active:true} : cfg().rewards.find(x=>x.id===d.r);
    modal(`<h2>${d.r==='new'?'New reward':'Edit reward'}</h2><div class="g3"><label class="fl">Picture<input id="r_emoji" value="${esc(r.emoji)}" maxlength="4" style="font-size:24px;text-align:center"></label><label class="fl">Reward<input id="r_title" value="${esc(r.title)}"></label></div>
      <div class="g2"><label class="fl">Stars needed<input id="r_cost" type="number" min="1" value="${r.cost}"></label><label class="fl">Cash to Spend jar (optional)<input id="r_cash" type="number" step="0.25" value="${esc(r.cash)}"></label></div>
      <div class="fl">${chipRow('active', [['1','On'],['0','Hidden']], [r.active?'1':'0'])}</div>
      <div class="mact">${d.r!=='new'?`<button class="btn bad" data-a="delreward" data-r="${r.id}">Delete</button>`:''}<span class="sp"></span><button class="btn light" data-a="close">Cancel</button><button class="btn" data-a="savereward" data-r="${r.id}">Save</button></div>`); return 'skip'; },
  savereward: d => { const v = {emoji:$('#r_emoji').value||'🎁', title:$('#r_title').value.trim(), cost:Math.max(1,Number($('#r_cost').value)||1), cash:$('#r_cash').value, active:chipVals('active')[0]!=='0'}; if (!v.title){ toast('Name the reward'); return 'skip'; }
    if (d.r==='new') cfg().rewards.push(Object.assign({id:'r'+uid()}, v)); else Object.assign(cfg().rewards.find(x=>x.id===d.r), v); modal(''); saveConfig('Reward saved'); },
  delreward: d => { if (!confirm('Delete this reward?')) return 'skip'; S.config.rewards = cfg().rewards.filter(x=>x.id!==d.r); modal(''); saveConfig('Deleted'); },
  savesettings: () => { const s = ST(), g = id => $('#s_'+id).value;
    if (/^\d{4,6}$/.test(g('pin'))) s.pin = g('pin'); else toast('PIN must be 4–6 digits; kept the old one');
    s.allowancePerYear = Number(g('allowancePerYear')); s.matchPct = Number(g('matchPct')); s.jars = {spend:Number(g('jSpend')), save:Number(g('jSave')), give:Number(g('jGive'))};
    s.starsPerDollar = Number(g('starsPerDollar'))||10; s.demeritCap = Number(g('demeritCap'))||15; s.fullDayBonus = Number(g('fullDayBonus')); s.streakDays = Number(g('streakDays')); s.streakBonus = Number(g('streakBonus')); s.sound = chipVals('sound')[0]==='1';
    const tiers = g('tiers').split(',').map(x=>x.split(':').map(Number)).filter(x=>x.length===2&&!x.some(isNaN)).map(([min,pay])=>({min,pay})); if (tiers.length) s.tiers = tiers;
    s.calendarNames = g('calendarNames'); s.shareEmails = g('shareEmails'); saveConfig('Settings saved'); },
  share: () => { const e = $('#s_shareEmails').value; ST().shareEmails = e; if (!e.trim()) { toast('Type at least one email'); return 'skip'; }
    call('apiShare', e).then(r => toast('Shared with '+r.shared.join(', '))).catch(err => toast('Could not share: '+(err.message||err))); saveConfig(' '); return 'skip'; },
  resync: () => { saveConfig('Sent to Google Calendar'); return 'skip'; },
  addevent: () => { modal(`<h2>Add to the Family Hub calendar</h2><label class="fl">What<input id="ev_t" placeholder="Soccer practice"></label><div class="g2"><label class="fl">Date<input id="ev_d" type="date" value="${TODAY()}"></label><label class="fl">Start (blank = all day)<input id="ev_s" type="time"></label><label class="fl">Minutes<input id="ev_m" type="number" value="60"></label></div>
      <div class="fl">Who${chipRow('evwho', cfg().people.map(p=>[p.id,p.name,p]), [])}</div><div class="mact"><span class="sp"></span><button class="btn light" data-a="close">Cancel</button><button class="btn" data-a="addeventyes">Add</button></div>`); return 'skip'; },
  addeventyes: () => { const t = $('#ev_t').value.trim(); if (!t){ toast('Add a title'); return 'skip'; } if (remote==='local'){ toast('Google is not connected on this copy'); return 'skip'; }
    const who = chipVals('evwho').map(id=>P(id).name).join(', ');
    call('apiAddEvent', {title:t, date:$('#ev_d').value, time:$('#ev_s').value, mins:$('#ev_m').value, who}).then(()=>{ toast('Added to Google Calendar'); pull(); }).catch(e=>toast('Could not add: '+(e.message||e))); modal(''); return 'skip'; },
  refresh: () => { pull(); toast('Refreshing…'); return 'skip'; },
};
function afterTick(p, ds, was, gateBefore){
  const s = ST(), list = listFor(p, now()), allDone = list.length && list.every(x=>x.d), fk = 'fullday:'+ds, have = (D.bonus[p.id+'|'+fk]||0) > 0;
  if (!p.kid) { if (!was && allDone) { confetti(col(p)); toast(`🏆 ${p.name} finished everything today!`); } return; }
  if (!was){
    const gl = list.filter(x => arr(s.gateSlots).includes(x.g) && !x.d).length;
    if (allDone && !have){
      log({kid:p.id, type:'bonus', ref:fk, stars:Number(s.fullDayBonus)||0, title:'Finished every chore today'}); D = derive();
      let streak = 0; for (let i=0;i<60;i++){ if ((D.bonus[p.id+'|fullday:'+ymd(addDays(pd(ds),-i))]||0) > 0) streak++; else break; }
      const sb = streak && streak % (Number(s.streakDays)||7) === 0; if (sb) log({kid:p.id, type:'bonus', ref:'streak:'+ds, stars:Number(s.streakBonus)||0, title:`${streak}-day streak!`});
      confetti(col(p)); say(`Great job ${p.name}! You finished everything today!`);
      modal(`<div class="big">🏆</div><h2 style="text-align:center">${esc(p.name)} finished everything!</h2><p class="hint" style="text-align:center">+${s.fullDayBonus} bonus ⭐${sb?` and +${s.streakBonus} ⭐ for a ${streak}-day streak!`:''}</p><div class="mact" style="justify-content:center"><button class="btn good" data-a="close">Yay!</button></div>`);
    } else if (gateBefore && !gl){ const gr = Object.keys(groundsFor(p.id)); confetti(col(p)); say(`${p.name}, playtime is unlocked!`); toast(`🎉 ${p.name}: Playtime unlocked!${gr.length?' (still grounded from '+gr.map(k=>PRIVS.find(x=>x[0]===k)[2].toLowerCase()).join(', ')+')':''}`); }
  } else if (have && !allDone){
    log({kid:p.id, type:'bonus', ref:fk, stars:-(Number(s.fullDayBonus)||0), title:'Undo: day not finished'});
    if ((D.bonus[p.id+'|streak:'+ds]||0) > 0) log({kid:p.id, type:'bonus', ref:'streak:'+ds, stars:-(Number(s.streakBonus)||0), title:'Undo streak'});
  }
}
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]'); if (!el) return; const fn = A[el.dataset.a]; if (!fn) return;
  const r = fn(el.dataset, el, ev); if (r !== 'skip') render();
  if (isParent()) U.parentUntil = Date.now()+5*60*1000;
});
document.addEventListener('input', ev => { if (ev.target.id==='f_title'){ const h = $('#namehint'); if (h) h.textContent = nameIssues($('#f_title').value, $('#f_room')?.value||'', ev.target.dataset.cid||'').join(' · '); } if (ev.target.id==='libq'){ U.q = ev.target.value; const box = $('#libl'); if (box) box.innerHTML = libList(); } });
document.addEventListener('change', ev => { if (ev.target.id==='libroom'){ U.room = ev.target.value; const box = $('#libl'); if (box) box.innerHTML = libList(); return; } if (ev.target.id==='libsort'){ U.sort = ev.target.value; const box = $('#libl'); if (box) box.innerHTML = libList(); return; } const el = ev.target; if (el.dataset.pf){ if (!isParent()){ needParent(()=>{}); render(); return; } const p = P(el.dataset.p); p[el.dataset.pf] = el.value || (el.dataset.pf==='name'?'?':''); saveConfig(); render(); } });
addEventListener('resize', () => { clearTimeout(A._r); A._r = setTimeout(() => { if (!busy()) render(); }, 200); });

// ---------- start ----------
(function boot(){
  try { const j = JSON.parse(localStorage.getItem(LS)||'null'); if (j){ S.config = j.config; S.log = j.log||[]; S.outbox = j.outbox||[]; } } catch(e){}
  S.config = normalize(S.config);
  if (!ST().startDate){ ST().startDate = TODAY(); store(); }
  remote = (window.google && google.script && google.script.run) ? 'gas' : (location.protocol.startsWith('http') && apiKey() ? 'url' : 'local');
  if ('serviceWorker' in navigator && remote==='url') navigator.serviceWorker.register('sw.js').catch(()=>{});
  if (DV.me) U.who = narrow() ? DV.me : 'all';
  render(); syncDot(remote==='local'?'':'busy');
  pull(true);
  let lastDay = TODAY();
  setInterval(() => { if (TODAY()!==lastDay){ lastDay = TODAY(); U.day = now().getDay(); U.off = 0; } if (U.view==='parent' && !isParent()) U.view = 'today'; if (!busy()) render(); }, 30000);
  setInterval(() => { if (!busy()) pull(); }, 45000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible'){ flush(); pull(); } });
  setInterval(flush, 20000);
})();
</script>
